<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cutlist</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 16px; color: #222; }
    h1 { margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    h1 .logo { width: 36px; height: 36px; }
    .sub { color: #666; margin: 0 0 20px; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 0 0 16px; padding: 12px 16px; overflow-x: auto; }
    legend { font-weight: 600; padding: 0 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    label { display: flex; flex-direction: column; font-size: 13px; color: #555; gap: 2px; }
    input, select { font: inherit; padding: 4px 6px; }
    input { width: 90px; }
    input.label { width: 140px; }
    #panels input.label { width: 210px; }
    input.num { text-align: right; }
    input.invalid { border-color: #c53030; background: #fff5f5; outline-color: #c53030; }
    table { border-collapse: collapse; }
    th { text-align: left; font-size: 13px; color: #555; font-weight: 500; padding: 2px 6px; }
    td { padding: 2px 6px; }
    button { font: inherit; padding: 6px 14px; cursor: pointer; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
    .check { flex-direction: row; align-items: center; gap: 4px; align-self: center; }
    #optimize { background: #2b6cb0; color: #fff; border: 0; border-radius: 4px; font-weight: 600; }
    .remove { padding: 2px 8px; }
    .handle { cursor: grab; touch-action: none; user-select: none; color: #999; font-size: 18px; padding: 0 2px 0 0; }
    .handle:hover { color: #333; }
    tr.dragging { opacity: 0.6; background: #e8eef7; }
    body.reordering, body.reordering * { cursor: grabbing !important; user-select: none; }
    .color-btn { display: flex; align-items: center; gap: 6px; width: 130px; padding: 4px 8px; border: 1px solid #0005; border-radius: 3px; text-align: left; }
    .color-btn .color-name { flex: 1; }
    .color-menu { inset: auto; margin: 0; padding: 6px; border: 1px solid #999; border-radius: 4px; background: #fff; box-shadow: 0 4px 14px #0003;
                  grid-template-columns: repeat(2, 120px); gap: 4px; }
    .color-menu:popover-open { display: grid; }
    .color-menu button { padding: 5px 8px; border: 1px solid #0003; border-radius: 3px; text-align: left; }
    .color-menu button:hover, .color-menu button:focus-visible { outline: 2px solid #222; outline-offset: 1px; }
    .color-menu button.selected { font-weight: 600; }
    .color-menu button.selected::after { content: ' ✓'; }
    .swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid #0004; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
    .stats { display: flex; gap: 24px; flex-wrap: wrap; margin: 12px 0; }
    .stats div { font-size: 13px; color: #555; }
    .stats strong { display: block; font-size: 22px; color: #222; }
    .warn { background: #fff4e5; border: 1px solid #f0b46c; padding: 8px 12px; border-radius: 4px; }
    .material { margin: 28px 0; border-top: 2px solid #ddd; padding-top: 8px; }
    .material h2 { margin: 0; font-size: 18px; }
    .sheet { margin: 16px 0; }
    .sheet h3 { margin: 0 0 6px; font-size: 15px; }
    svg { width: 100%; height: auto; display: block; }
    svg[data-corners] { cursor: crosshair; touch-action: none; }
    .measure, .cuts { pointer-events: none; }
    svg .panel { cursor: grab; }
    body.arranging, body.arranging * { cursor: grabbing !important; user-select: none; }
    .sheet h3 .manual { font-weight: 400; color: #b7791f; font-size: 13px; margin-left: 6px; }
    #results.hide-cuts .cuts, #results.hide-cuts .cut-list, #results.hide-cuts .cuts-note { display: none; }
    .cut-list { margin-top: 8px; font-size: 13px; }
    .cut-list th { border-bottom: 1px solid #ccc; }
    .cut-list td { padding: 3px 6px; vertical-align: top; }
    .cut-list tbody tr:nth-child(even) { background: #f6f6f6; }
    .cut-list td.n { color: #d1242f; font-weight: 600; white-space: nowrap; }
    .cut-list td.size { font-weight: 600; text-align: right; }
    .cuts-note { font-size: 13px; color: #555; }
    .project { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
    .project input { width: 220px; }
    #projectStatus { font-size: 13px; color: #666; align-self: center; }
    #projectStatus.dirty { color: #b7791f; }
    #projectStatus.error { color: #c53030; }
  </style>
</head>
<body>
  <h1><img class="logo" src="favicon.svg" alt="">cutlist</h1>
  <p class="sub">Sheet goods cut optimizer. Use any unit (mm or inches) — just be consistent.</p>

  <fieldset>
    <legend>Project</legend>
    <div class="project">
      <label>Open <select id="projectList"></select></label>
      <label>Name <input id="projectName" placeholder="e.g. Kitchen cabinets"></label>
      <button id="saveProject" type="button">Save</button>
      <button id="saveProjectAs" type="button">Save as new</button>
      <button id="newProject" type="button">New</button>
      <button id="deleteProject" type="button">Delete</button>
      <span id="projectStatus"></span>
    </div>
  </fieldset>

  <fieldset>
    <legend>Sheet goods</legend>
    <table>
      <thead><tr><th></th><th>Name</th><th>Thickness</th><th>Length</th><th>Width</th><th>Qty</th><th>Edge trim</th><th>Colour</th><th></th></tr></thead>
      <tbody id="materials"></tbody>
    </table>
    <p><button id="addMaterial" type="button">+ Add sheet good</button></p>
    <div class="row">
      <label>Blade kerf <input id="kerf" class="num" value="3"></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Panels</legend>
    <table>
      <thead><tr><th></th><th>Label</th><th>Length</th><th>Width</th><th>Qty</th><th>Material</th><th></th></tr></thead>
      <tbody id="panels"></tbody>
    </table>
    <p><button id="addPanel" type="button">+ Add panel</button></p>
  </fieldset>

  <div class="actions">
    <label>Layout <select id="algorithm"></select></label>
    <button id="optimize" type="button">Optimize</button>
    <button id="exportPdf" type="button">Export PDF</button>
    <label class="check"><input type="checkbox" id="showCuts" checked> Show cuts</label>
  </div>

  <section id="results"></section>

  <script src="formula.js"></script>
  <script src="optimizer.js"></script>
  <script src="arrange.js"></script>
  <script src="pdf.js"></script>
  <script>
    const materialsBody = document.getElementById('materials');
    const algorithmSelect = document.getElementById('algorithm');
    algorithmSelect.innerHTML = Object.entries(Cutlist.ALGORITHMS).map(([value, name]) => `<option value="${value}">${name}</option>`).join('');
    // Switching layout re-runs the optimizer if results are showing.
    algorithmSelect.addEventListener('change', () => results.querySelector('svg') && runOptimize());
    const panelsBody = document.getElementById('panels');
    const results = document.getElementById('results');
    const newId = () => `m${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;

    // Palette for telling materials apart in the cut diagrams. No greys: grey marks waste.
    const COLORS = [
      { name: 'Red', fill: '#e53935' },
      { name: 'Orange', fill: '#fb8c00' },
      { name: 'Yellow', fill: '#fdd835' },
      { name: 'Lime', fill: '#c0ca33' },
      { name: 'Green', fill: '#43a047' },
      { name: 'Light green', fill: '#a5d6a7' },
      { name: 'Teal', fill: '#00897b' },
      { name: 'Cyan', fill: '#26c6da' },
      { name: 'Sky blue', fill: '#90caf9' },
      { name: 'Blue', fill: '#1e88e5' },
      { name: 'Navy', fill: '#283593' },
      { name: 'Purple', fill: '#8e24aa' },
      { name: 'Lavender', fill: '#c5b3e6' },
      { name: 'Pink', fill: '#f48fb1' },
      { name: 'Maroon', fill: '#880e4f' },
      { name: 'Brown', fill: '#8d6e63' },
    ].map((c) => ({ ...c, ...shadesFor(c.fill) }));

    // Label text and outline colours that stay readable on the given fill.
    function shadesFor(hex) {
      const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
      const light = 0.299 * r + 0.587 * g + 0.114 * b > 140;
      return { text: light ? '#1a1a1a' : '#ffffff', stroke: light ? '#555555' : '#1a1a1a' };
    }

    const colorOf = (id) => COLORS.find((c) => c.fill === id) || COLORS[0];

    // Default colour for a new sheet good: the first unused one, visiting the palette
    // in a spread-out order so consecutive materials get clearly different shades.
    const DEFAULT_ORDER = [9, 1, 4, 11, 2, 0, 7, 13, 15, 3, 10, 6, 12, 14, 8, 5];
    function unusedColor() {
      const used = new Set([...materialsBody.querySelectorAll('select.color')].map((s) => s.value));
      const i = DEFAULT_ORDER.find((i) => !used.has(COLORS[i].fill));
      return COLORS[i ?? DEFAULT_ORDER[materialsBody.rows.length % COLORS.length]].fill;
    }

    // The colour picker: a button showing swatch + name, backed by a hidden <select> that holds
    // the value. One shared popover menu lists the palette with swatches.
    function paintColorSelect(select) {
      const c = colorOf(select.value);
      const btn = select.nextElementSibling;
      btn.style.background = c.fill;
      btn.style.color = c.text;
      btn.querySelector('.color-name').textContent = c.name;
    }

    const colorMenu = document.createElement('div');
    colorMenu.className = 'color-menu';
    colorMenu.popover = 'auto';
    document.body.append(colorMenu);
    let menuSelect = null;

    function openColorMenu(select, btn) {
      menuSelect = select;
      colorMenu.innerHTML = COLORS.map((c) => `
        <button type="button" data-fill="${c.fill}" class="${c.fill === select.value ? 'selected' : ''}"
          style="background:${c.fill};color:${c.text}">${c.name}</button>`).join('');
      colorMenu.showPopover();
      const r = btn.getBoundingClientRect();
      const m = colorMenu.getBoundingClientRect();
      const below = r.bottom + 2 + m.height <= innerHeight;
      colorMenu.style.top = `${below ? r.bottom + 2 : Math.max(4, r.top - 2 - m.height)}px`;
      colorMenu.style.left = `${Math.min(r.left, innerWidth - m.width - 4)}px`;
      colorMenu.querySelector('.selected')?.focus();
    }

    colorMenu.addEventListener('click', (e) => {
      const choice = e.target.closest('button');
      if (!choice) return;
      menuSelect.value = choice.dataset.fill;
      menuSelect.dispatchEvent(new Event('change', { bubbles: true }));
      colorMenu.hidePopover();
      menuSelect.nextElementSibling.focus();
    });
    // The menu is positioned against the viewport, so close it rather than let it drift on scroll.
    addEventListener('scroll', () => colorMenu.matches(':popover-open') && colorMenu.hidePopover(), true);

    // Numeric fields accept plain numbers or formulas like "=2400-60-60" (see formula.js).
    const num = (v) => Formula.toNumber(v) || 0;
    const int = (v) => Math.trunc(num(v));

    // On Enter or leaving the field, replace a formula with its result, or flag it if invalid.
    function commitFormula(input) {
      const text = input.value.trim();
      input.dataset.title ??= input.title;
      let error = null;
      if (text !== '') {
        try {
          const value = Formula.evaluate(text);
          if (String(value) !== text) input.value = value;
        } catch (err) {
          error = err.message;
        }
      }
      input.classList.toggle('invalid', !!error);
      input.title = error ? `Invalid formula: ${error}` : input.dataset.title;
    }
    document.addEventListener('change', (e) => e.target.matches('input.num') && commitFormula(e.target));
    document.addEventListener('keydown', (e) => e.key === 'Enter' && e.target.matches('input.num') && commitFormula(e.target));

    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fmt = (n) => +n.toFixed(2);
    const materialName = (m) => `${m.name || 'Unnamed'}${m.thickness ? ` ${fmt(m.thickness)}` : ''}`;

    // Show unset (zero) dimensions as empty fields.
    const blank = (n) => n || '';

    function addMaterialRow(m = {}) {
      m = { name: '', qty: 1, trim: 0, ...m };
      // Colours not in the palette (e.g. from an older version) get a fresh default.
      const color = COLORS.some((c) => c.fill === m.color) ? m.color : unusedColor();
      const tr = document.createElement('tr');
      tr.dataset.id = m.id || newId();
      tr.innerHTML = `
        <td class="handle" title="Drag to reorder">⠿</td>
        <td><input class="label" value="${esc(m.name)}" placeholder="e.g. Plywood"></td>
        <td><input class="num" value="${blank(m.thickness)}"></td>
        <td><input class="num" value="${blank(m.length)}"></td>
        <td><input class="num" value="${blank(m.width)}"></td>
        <td><input class="num" value="${m.qty}"></td>
        <td><input class="num" value="${m.trim}" title="Removed from each edge to re-square the sheet"></td>
        <td><select class="color" hidden>${COLORS.map((c) => `<option value="${c.fill}">${c.name}</option>`).join('')}</select><button
          type="button" class="color-btn" title="Colour used for this material in the cut diagrams"><span class="color-name"></span>▾</button></td>
        <td><button class="remove" type="button" title="Remove">✕</button></td>`;
      tr.querySelector('.remove').onclick = () => { tr.remove(); refreshMaterialSelects(); markDirty(); };
      tr.addEventListener('input', refreshMaterialSelects);
      const colorSelect = tr.querySelector('select.color');
      colorSelect.value = color;
      paintColorSelect(colorSelect);
      colorSelect.addEventListener('change', () => paintColorSelect(colorSelect));
      // Pressing the button of an already-open menu closes it (light dismiss) rather than reopening it.
      const colorBtn = colorSelect.nextElementSibling;
      let wasOpen = false;
      colorBtn.onpointerdown = () => { wasOpen = colorMenu.matches(':popover-open') && menuSelect === colorSelect; };
      colorBtn.onclick = () => {
        if (!wasOpen) openColorMenu(colorSelect, colorBtn);
        wasOpen = false;
      };
      materialsBody.appendChild(tr);
      refreshMaterialSelects();
      return tr.dataset.id;
    }

    function readMaterials() {
      return [...materialsBody.rows].map((tr) => {
        const [name, thickness, length, width, qty, trim] = [...tr.querySelectorAll('input')].map((i) => i.value);
        return {
          id: tr.dataset.id,
          name: name.trim(),
          thickness: num(thickness),
          length: num(length),
          width: num(width),
          qty: Math.max(1, int(qty)),
          trim: num(trim),
          color: tr.querySelector('select.color').value,
        };
      });
    }

    // Keep every panel's material dropdown in sync with the sheet goods table.
    function refreshMaterialSelects() {
      const options = readMaterials().map((m) => `<option value="${m.id}">${esc(materialName(m))}</option>`).join('');
      for (const select of panelsBody.querySelectorAll('select')) {
        const current = select.value;
        select.innerHTML = '<option value="">— choose —</option>' + options;
        select.value = [...select.options].some((o) => o.value === current) ? current : '';
      }
    }

    function addPanelRow(p = {}) {
      p = { label: '', qty: 1, material: '', ...p };
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="handle" title="Drag to reorder">⠿</td>
        <td><input class="label" value="${esc(p.label)}"></td>
        <td><input class="num" value="${blank(p.length)}"></td>
        <td><input class="num" value="${blank(p.width)}"></td>
        <td><input class="num" value="${blank(p.qty)}"></td>
        <td><select></select></td>
        <td><button class="remove" type="button" title="Remove">✕</button></td>`;
      tr.querySelector('.remove').onclick = () => { tr.remove(); markDirty(); };
      panelsBody.appendChild(tr);
      refreshMaterialSelects();
      // Default a new panel to the material of the previous row.
      const prev = tr.previousElementSibling?.querySelector('select').value || '';
      tr.querySelector('select').value = p.material || prev;
    }

    // Every panel row as entered (used for saving); readPanels() keeps only usable ones.
    function readPanelRows() {
      return [...panelsBody.rows].map((tr) => {
        const [label, length, width, qty] = [...tr.querySelectorAll('input')].map((i) => i.value);
        return {
          label: label.trim(),
          length: num(length),
          width: num(width),
          qty: int(qty),
          material: tr.querySelector('select').value,
        };
      });
    }

    // Drag-and-drop reordering of a table's rows by their .handle cell (mouse and touch).
    function enableRowReorder(tbody, onReorder) {
      tbody.addEventListener('pointerdown', (e) => {
        const handle = e.target.closest('.handle');
        if (!handle || e.button !== 0) return;
        e.preventDefault();
        const row = handle.closest('tr');
        const startIndex = row.sectionRowIndex;
        row.classList.add('dragging');
        document.body.classList.add('reordering');

        // Move the row next to whichever row the pointer is over (before it in its top half, after in its bottom half).
        const move = (ev) => {
          const rows = [...tbody.rows];
          const first = rows[0].getBoundingClientRect();
          const last = rows[rows.length - 1].getBoundingClientRect();
          if (ev.clientY < first.top) return tbody.prepend(row);
          if (ev.clientY > last.bottom) return tbody.append(row);
          for (const other of rows) {
            if (other === row) continue;
            const r = other.getBoundingClientRect();
            if (ev.clientY >= r.top && ev.clientY <= r.bottom) {
              if (ev.clientY < r.top + r.height / 2) other.before(row);
              else other.after(row);
              break;
            }
          }
        };
        const end = () => {
          removeEventListener('pointermove', move);
          removeEventListener('pointerup', end);
          removeEventListener('pointercancel', end);
          row.classList.remove('dragging');
          document.body.classList.remove('reordering');
          if (row.sectionRowIndex !== startIndex) onReorder();
        };
        addEventListener('pointermove', move);
        addEventListener('pointerup', end);
        addEventListener('pointercancel', end);
      });
    }
    enableRowReorder(panelsBody, () => markDirty());
    enableRowReorder(materialsBody, () => { refreshMaterialSelects(); markDirty(); });

    const readPanels = () => readPanelRows().filter((p) => p.length > 0 && p.width > 0 && p.qty > 0);

    // Example data so the page is useful on first open.
    const EXAMPLE = {
      kerf: 3,
      algorithm: 'rip',
      materials: [
        { id: 'ply18', name: 'Plywood', thickness: 18, length: 2440, width: 1220, qty: 3, trim: 10 },
        { id: 'mdf18', name: 'MDF', thickness: 18, length: 2440, width: 1220, qty: 2, trim: 0 },
        { id: 'ply5', name: 'Plywood', thickness: 5, length: 2440, width: 1220, qty: 1, trim: 10 },
      ],
      panels: [
        { label: 'Side', length: 720, width: 560, qty: 2, material: 'ply18' },
        { label: 'Top/Bottom', length: 764, width: 560, qty: 2, material: 'ply18' },
        { label: 'Shelf', length: 762, width: 540, qty: 3, material: 'ply18' },
        { label: 'Door', length: 716, width: 390, qty: 2, material: 'mdf18' },
        { label: 'Back', length: 784, width: 720, qty: 1, material: 'ply5' },
      ],
    };

    // ---- Projects -------------------------------------------------------------------------

    const projectList = document.getElementById('projectList');
    const projectName = document.getElementById('projectName');
    const projectStatus = document.getElementById('projectStatus');
    const LAST_PROJECT_KEY = 'cutlist.lastProjectId';
    let currentId = null;
    let dirty = false;
    let loading = false;

    // The results on screen: { result, inputs, key, manual }. key identifies the inputs the result was made
    // from, so a saved manual arrangement is only reused while those inputs are unchanged.
    let current = null;
    const inputsKey = ({ kerf, algorithm, materials, panels }) => JSON.stringify([kerf, algorithm,
      materials.map(({ id, length, width, qty, trim }) => [id, length, width, qty, trim]),
      panels.map(({ label, length, width, qty, material }) => [label, length, width, qty, material])]);

    function setStatus(text, kind = '') {
      projectStatus.textContent = text;
      projectStatus.className = kind;
    }

    function markDirty() {
      if (loading || dirty) return;
      dirty = true;
      setStatus('Unsaved changes', 'dirty');
    }

    function remember(id) {
      try {
        if (id) localStorage.setItem(LAST_PROJECT_KEY, id);
        else localStorage.removeItem(LAST_PROJECT_KEY);
      } catch {}
    }

    const projectData = () => ({
      kerf: num(document.getElementById('kerf').value),
      algorithm: algorithmSelect.value,
      materials: readMaterials(),
      panels: readPanelRows(),
      ...(current?.manual && { layout: savedLayout() }),
    });

    // A manual arrangement, saved with the inputs it was made from.
    const savedLayout = () => ({
      key: current.key,
      groups: current.result.groups.map((g) => ({
        material: g.material.id,
        sheets: g.sheets.map((s) => ({ placements: s.placements, manual: !!s.manual })),
        unplaced: g.unplaced,
      })),
    });

    // Show a saved arrangement if the form still holds the inputs it was made from.
    function restoreLayout(layout) {
      if (!layout || document.querySelector('input.num.invalid')) return;
      const inputs = { kerf: num(document.getElementById('kerf').value), algorithm: algorithmSelect.value, materials: readMaterials(), panels: readPanels() };
      if (inputsKey(inputs) !== layout.key) return;
      const result = Cutlist.restore(inputs, layout.groups);
      if (!result) return;
      current = { result, inputs, key: layout.key, manual: true };
      render(result);
    }

    // Replace the whole form with the given project data.
    function fillForm(name, data) {
      loading = true;
      projectName.value = name;
      document.getElementById('kerf').value = data.kerf ?? 3;
      algorithmSelect.value = Cutlist.ALGORITHMS[data.algorithm] ? data.algorithm : 'rip';
      materialsBody.innerHTML = '';
      panelsBody.innerHTML = '';
      (data.materials || []).forEach(addMaterialRow);
      (data.panels || []).forEach(addPanelRow);
      results.innerHTML = '';
      current = null;
      restoreLayout(data.layout);
      loading = false;
      dirty = false;
    }

    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body && JSON.stringify(body),
      });
      const json = res.status === 204 ? null : await res.json();
      if (!res.ok) throw new Error(json?.error || `Request failed (${res.status})`);
      return json;
    }

    async function refreshProjectList() {
      const projects = await api('GET', '/api/projects');
      projectList.innerHTML = '<option value="">— select —</option>' + projects
        .map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
      projectList.value = currentId ?? '';
    }

    const confirmDiscard = () => !dirty || confirm('You have unsaved changes. Discard them?');

    async function openProject(id) {
      const project = await api('GET', `/api/projects/${id}`);
      currentId = project.id;
      fillForm(project.name, project.data);
      projectList.value = currentId;
      remember(currentId);
      setStatus(`Opened · last saved ${new Date(project.updatedAt).toLocaleString()}`);
    }

    function newProject(data = { kerf: 3, materials: [{}], panels: [{}] }, name = '') {
      currentId = null;
      fillForm(name, data);
      projectList.value = '';
      remember(null);
      setStatus('New project — not saved yet');
    }

    async function saveProject(asNew = false) {
      const name = projectName.value.trim();
      if (!name) {
        setStatus('Enter a project name to save', 'error');
        projectName.focus();
        return;
      }
      try {
        const body = { name, data: projectData() };
        const project = currentId && !asNew
          ? await api('PUT', `/api/projects/${currentId}`, body)
          : await api('POST', '/api/projects', body);
        currentId = project.id;
        dirty = false;
        remember(currentId);
        await refreshProjectList();
        setStatus(`Saved ${new Date(project.updatedAt).toLocaleTimeString()}`);
      } catch (err) {
        setStatus(err.message, 'error');
      }
    }

    async function deleteProject() {
      if (!currentId) return setStatus('This project has not been saved', 'error');
      if (!confirm(`Delete project "${projectName.value}"? This cannot be undone.`)) return;
      try {
        await api('DELETE', `/api/projects/${currentId}`);
        newProject();
        await refreshProjectList();
        setStatus('Project deleted');
      } catch (err) {
        setStatus(err.message, 'error');
      }
    }

    projectList.onchange = async () => {
      const id = projectList.value;
      if (!id || Number(id) === currentId) return;
      if (!confirmDiscard()) {
        projectList.value = currentId ?? '';
        return;
      }
      try {
        await openProject(id);
      } catch (err) {
        setStatus(err.message, 'error');
        projectList.value = currentId ?? '';
      }
    };
    document.getElementById('saveProject').onclick = () => saveProject();
    document.getElementById('saveProjectAs').onclick = () => saveProject(true);
    document.getElementById('newProject').onclick = () => confirmDiscard() && newProject();
    document.getElementById('deleteProject').onclick = deleteProject;
    window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });

    // Any edit to the project form marks it as changed.
    for (const id of ['projectName', 'kerf', 'algorithm', 'materials', 'panels']) {
      document.getElementById(id).addEventListener('input', markDirty);
      document.getElementById(id).addEventListener('change', markDirty);
    }

    document.getElementById('addMaterial').onclick = () => { addMaterialRow(); markDirty(); };
    document.getElementById('addPanel').onclick = () => { addPanelRow(); markDirty(); };
    document.getElementById('optimize').onclick = runOptimize;
    document.getElementById('exportPdf').onclick = exportPdf;

    // Cut lines are drawn always and hidden with CSS, so toggling needs no re-render.
    // A viewing preference, not project data: remembered per browser.
    const SHOW_CUTS_KEY = 'cutlist.showCuts';
    const showCuts = document.getElementById('showCuts');
    try { showCuts.checked = localStorage.getItem(SHOW_CUTS_KEY) !== '0'; } catch {}
    const applyShowCuts = () => results.classList.toggle('hide-cuts', !showCuts.checked);
    showCuts.addEventListener('change', () => {
      applyShowCuts();
      try { localStorage.setItem(SHOW_CUTS_KEY, showCuts.checked ? '1' : '0'); } catch {}
    });
    applyShowCuts();

    // Start with the last opened project, or the example if there is none.
    (async () => {
      let lastId = null;
      try { lastId = localStorage.getItem(LAST_PROJECT_KEY); } catch {}
      try {
        if (lastId) await openProject(lastId);
      } catch {
        lastId = null;
      }
      if (!currentId) newProject(EXAMPLE, 'Example cabinet');
      try {
        await refreshProjectList();
      } catch (err) {
        setStatus(`Could not load projects: ${err.message}`, 'error');
      }
    })();

    // Validate the form and run the optimizer. Shows a warning and returns null if the input isn't usable.
    function optimizeForm() {
      const invalidField = document.querySelector('input.num.invalid');
      if (invalidField) {
        results.innerHTML = '<p class="warn">Fix the invalid formula (highlighted in red) first.</p>';
        invalidField.focus();
        return null;
      }
      const materials = readMaterials();
      const panels = readPanels();
      if (!panels.length) {
        results.innerHTML = '<p class="warn">Add at least one panel.</p>';
        return null;
      }
      const invalid = materials.filter((m) => panels.some((p) => p.material === m.id)
        && (m.length <= 2 * m.trim || m.width <= 2 * m.trim));
      if (invalid.length) {
        results.innerHTML = `<p class="warn">Sheet size is missing or too small for its edge trim: ${invalid.map((m) => esc(materialName(m))).join(', ')}.</p>`;
        return null;
      }
      const kerf = num(document.getElementById('kerf').value);
      const algorithm = algorithmSelect.value;
      return { kerf, algorithm, materials, panels };
    }

    // Optimizing replaces any manual arrangement.
    function runOptimize() {
      const inputs = optimizeForm();
      if (!inputs) return null;
      if (current?.manual) markDirty();
      current = { result: Cutlist.optimize(inputs), inputs, key: inputsKey(inputs), manual: false };
      render(current.result);
      return inputs;
    }

    function exportPdf() {
      let inputs = optimizeForm();
      if (!inputs) return;
      // Export what is on screen (possibly rearranged by hand) if it still matches the form.
      if (current?.key !== inputsKey(inputs)) inputs = runOptimize();
      const run = { ...inputs, result: current.result };
      const name = projectName.value.trim();
      const bytes = CutlistPdf.buildReport({
        ...run,
        name: name || 'Untitled project',
        date: new Date().toLocaleString(),
        algorithmName: Cutlist.ALGORITHMS[run.algorithm],
        showCuts: showCuts.checked,
        colorOf,
        materialName,
      });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      link.download = `${(name || 'cutlist').replace(/[\\/:*?"<>|]+/g, '-')}.pdf`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    }

    function render({ groups, unassigned }) {
      let html = '';
      if (unassigned.length) {
        html += `<p class="warn"><strong>${unassigned.length} panel row(s) have no material</strong> and were skipped:
          ${unassigned.map((p) => esc(p.label || `${fmt(p.length)} × ${fmt(p.width)}`)).join(', ')}</p>`;
      }
      if (groups.some((g) => g.sheets.length)) html += `<p class="cuts-note">Cut lists: <strong>Set at</strong> is the width cut off,
        measured from the top edge (rips) or left edge (crosscuts) of the stock as drawn; the kerf falls on the far side.
        Re-squaring the edges (edge trim) comes before cut 1.</p>`;
      groups.forEach((g, gi) => { html += renderGroup(g, gi); });
      results.innerHTML = html;
      measure = null; // any measurement belonged to the old diagrams
    }

    function renderGroup({ material, sheets, unplaced, stats }, gi) {
      let html = `
        <div class="material">
          <h2><span class="swatch" style="background:${material.color}"></span>${esc(materialName(material))} <small>(${fmt(material.length)} × ${fmt(material.width)})</small></h2>
          <div class="stats">
            <div><strong>${stats.sheetsUsed} / ${material.qty}</strong>sheets used</div>
            <div><strong>${(stats.yield * 100).toFixed(1)}%</strong>yield</div>
            <div><strong>${stats.partsPlaced}</strong>panels placed</div>
          </div>`;
      if (unplaced.length) {
        const counts = {};
        unplaced.forEach((p) => {
          const key = `${p.label} (${fmt(p.w)} × ${fmt(p.h)})`;
          counts[key] = (counts[key] || 0) + 1;
        });
        html += `<p class="warn"><strong>${unplaced.length} panel(s) did not fit</strong> (too large, or not enough sheets):<br>
          ${Object.entries(counts).map(([k, n]) => `${n} × ${esc(k)}`).join('<br>')}</p>`;
      }
      sheets.forEach((s, si) => { html += sheetBlock(gi, si); });
      return html + '</div>';
    }

    function sheetBlock(gi, si) {
      const { material, sheets } = current.result.groups[gi];
      const s = sheets[si];
      return `<div class="sheet" data-g="${gi}" data-s="${si}"><h3>Sheet ${si + 1} of ${sheets.length} — ${s.placements.length} panels${
        s.manual ? '<span class="manual">arranged by hand</span>' : ''}</h3>${sheetSvg(material, s)}${cutListTable(s.cuts)}</div>`;
    }

    function sheetSvg(material, s) {
      const { length: L, width: W, trim: t } = material;
      // Snap targets for the measuring tool: sheet, trim and panel corners.
      const corners = new Set();
      const addCorners = (x, y, w, h) => [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].forEach(([cx, cy]) => corners.add(`${cx},${cy}`));
      addCorners(0, 0, L, W);
      if (t > 0) addCorners(t, t, L - 2 * t, W - 2 * t);
      for (const p of s.placements) addCorners(p.x, p.y, p.w, p.h);
      return `<svg viewBox="-2 -2 ${L + 4} ${W + 4}" xmlns="http://www.w3.org/2000/svg"
        data-corners="${[...corners].join(';')}" data-length="${L}" data-width="${W}">
        <g class="layout">${sheetLayout(material, s.placements, s.cuts)}</g></svg>`;
    }

    // The sheet drawing. While dragging (drag = { i, valid, ghost: {x, y} }) panel i is outlined
    // at its new place, a ghost follows the pointer (dark grey where the panel can't go) and
    // cut lines are left out.
    function sheetLayout(material, placements, cuts, drag) {
      const { length: L, width: W, trim: t } = material;
      const font = Math.max(L, W) / 60;
      const c = colorOf(material.color);
      let out = `<rect x="0" y="0" width="${L}" height="${W}" fill="#d9d9d9" stroke="#555" stroke-width="2"/>`;
      if (t > 0) {
        out += `<rect x="${t}" y="${t}" width="${L - 2 * t}" height="${W - 2 * t}" fill="#ececec" stroke="#b33" stroke-width="1" stroke-dasharray="8 6"/>`;
      }
      placements.forEach((p, i) => {
        const moving = drag && i === drag.i;
        out += moving
          ? `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${drag.valid ? c.fill : 'none'}" fill-opacity="0.45"
              stroke="#222" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`
          : `<rect class="panel" data-i="${i}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1.5"/>`;
        if (moving) return;
        // Text runs along the panel's longest edge (bottom-to-top on tall panels). Dimensions are
        // always shown in full (font shrinks to fit); the label is shortened with "…" if needed.
        const vertical = p.h > p.w;
        const along = (vertical ? p.h : p.w) * 0.9;
        const across = vertical ? p.w : p.h;
        const dims = `${fmt(p.w)} × ${fmt(p.h)}${p.rotated ? ' ↻' : ''}`;
        const f = Math.min(font, across / 3, along / (0.85 * textWidth(dims, 1)));
        if (f < font / 6) return; // too small to read
        const label = fitText(p.label, along, f);
        const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
        out += `<g transform="translate(${cx} ${cy})${vertical ? ' rotate(-90)' : ''}" text-anchor="middle" fill="${c.text}" pointer-events="none">
          <text y="${-f * 0.2}" font-size="${f}">${esc(label)}</text>
          <text y="${f * 1.1}" font-size="${f * 0.85}">${esc(dims)}</text></g>`;
      });
      if (!drag) return out + cutsSvg(cuts, font);
      const p = placements[drag.i];
      return out + `<rect x="${drag.ghost.x}" y="${drag.ghost.y}" width="${p.w}" height="${p.h}" pointer-events="none"
        fill="${drag.valid ? c.fill : '#4a4a4a'}" fill-opacity="${drag.valid ? 0.75 : 0.9}" stroke="#222" stroke-width="1.5"/>`;
    }

    function cutListTable(cuts = []) {
      if (!cuts.length) return '';
      const rows = Cutlist.cutList(cuts, fmt).map((r) => `<tr><td class="n">${r.cuts}</td><td>${r.type}</td>
        <td class="size">${r.size}</td><td>${r.stock}</td><td>${esc(r.gives)}</td></tr>`).join('');
      return `<table class="cut-list"><thead><tr><th>Cut</th><th>Operation</th><th>Set at</th><th>Cut from</th><th>Gives</th></tr></thead>
        <tbody>${rows}</tbody></table>`;
    }

    // Cut lines in saw order, drawn over the panels. Each number sits near the start of its line,
    // clear of the panel text, which is centred.
    function cutsSvg(cuts = [], font) {
      let lines = '', badges = '';
      for (const c of cuts) {
        const [x1, y1, x2, y2] = c.dir === 'h' ? [c.from, c.at, c.to, c.at] : [c.at, c.from, c.at, c.to];
        lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" vector-effect="non-scaling-stroke"/>`;
        const r = Math.min(font * 0.6, (c.to - c.from) / 2);
        const along = c.from + Math.min((c.to - c.from) / 2, r * 2.5);
        const [bx, by] = c.dir === 'h' ? [along, c.at] : [c.at, along];
        badges += `<g transform="translate(${bx} ${by})"><circle r="${r}"/>
          <text y="${r * 0.36}" fill="#d1242f" stroke="none" font-size="${r * (c.n > 9 ? 0.95 : 1.1)}">${c.n}</text></g>`;
      }
      return `<g class="cuts"><g stroke="#d1242f" stroke-width="2">${lines}</g>
        <g fill="#fff" stroke="#d1242f" stroke-width="1.5" text-anchor="middle" font-weight="600">${badges}</g></g>`;
    }

    // ---- Manual arrangement ----------------------------------------------------------------
    // Drag a panel to another place on the same sheet; the others re-pack around it (Arrange).
    // A press without movement stays a click, for the measuring tool. Dropping where the panel
    // can't go (dark grey) snaps back; a valid drop updates the cut lines and the cut list.

    const DRAG_PX = 4;
    let arranging = null; // { svg, gi, si, i, start, grab, tree, preview, valid, moved }
    let suppressClick = false;

    results.addEventListener('pointerdown', (e) => {
      const rect = e.target.closest('rect.panel');
      if (!rect || e.button !== 0 || measure) return;
      const block = rect.closest('.sheet');
      const gi = +block.dataset.g, si = +block.dataset.s, i = +rect.dataset.i;
      const { material } = current.result.groups[gi];
      const sheet = current.result.groups[gi].sheets[si];
      const svg = rect.ownerSVGElement;
      const point = toSvg(svg, e);
      const p = sheet.placements[i];
      arranging = { svg, gi, si, i, start: { x: e.clientX, y: e.clientY }, grab: { x: point.x - p.x, y: point.y - p.y },
        tree: Cutlist.layoutTree(sheet.placements, material, current.inputs.kerf, current.inputs.algorithm), moved: false };
      e.preventDefault(); // no text selection while dragging
    });

    addEventListener('pointermove', (e) => {
      const a = arranging;
      if (!a) return;
      if (!a.moved && Math.hypot(e.clientX - a.start.x, e.clientY - a.start.y) < DRAG_PX) return;
      if (!a.moved) {
        a.moved = true;
        document.body.classList.add('arranging');
        drawMeasure(a.svg, null); // hide the corner snap marker
      }
      const { material, sheets } = current.result.groups[a.gi];
      const placements = sheets[a.si].placements;
      const point = toSvg(a.svg, e);
      const ghost = { x: point.x - a.grab.x, y: point.y - a.grab.y };
      const onSheet = point.x >= 0 && point.y >= 0 && point.x <= material.length && point.y <= material.width;
      const r = Arrange.move({ placements, tree: a.tree, i: a.i, target: ghost, material, kerf: current.inputs.kerf });
      a.valid = onSheet && r.valid;
      a.preview = a.valid ? r.placements : placements;
      a.svg.querySelector('.layout').innerHTML = sheetLayout(material, a.preview, [], { i: a.i, valid: a.valid, ghost });
    });

    function endArranging(commit) {
      const a = arranging;
      arranging = null;
      if (!a?.moved) return;
      document.body.classList.remove('arranging');
      suppressClick = true; // the click that ends a drag must not start a measurement
      setTimeout(() => { suppressClick = false; });
      const { material, sheets } = current.result.groups[a.gi];
      const sheet = sheets[a.si];
      const changed = commit && a.valid && a.preview.some((p, j) => p.x !== sheet.placements[j].x || p.y !== sheet.placements[j].y);
      if (changed) {
        sheet.placements = a.preview;
        sheet.cuts = Cutlist.sheetCuts(sheet.placements, material, current.inputs.kerf, current.inputs.algorithm);
        sheet.manual = true;
        current.manual = true;
        markDirty();
      }
      a.svg.closest('.sheet').outerHTML = sheetBlock(a.gi, a.si);
    }
    addEventListener('pointerup', () => endArranging(true));
    addEventListener('pointercancel', () => endArranging(false));
    document.addEventListener('keydown', (e) => e.key === 'Escape' && endArranging(false));

    // ---- Measuring tool --------------------------------------------------------------------
    // Click a corner to start; a dotted line follows the mouse (snapping to nearby corners) with
    // a distance label. Holding Shift keeps the line horizontal or vertical. The next click, or
    // Escape, clears it.

    const SNAP_PX = 10;
    const SVG_NS = 'http://www.w3.org/2000/svg';
    let measure = null; // { svg, start: {x, y} } while measuring
    let hoverSvg = null;
    let lastPointer = null; // { svg, point } — to redraw when Shift is pressed without moving

    const pxPerUnit = (svg) => svg.getScreenCTM().a;
    const toSvg = (svg, e) => new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());

    function cornersOf(svg) {
      svg._corners ??= svg.dataset.corners.split(';').map((c) => {
        const [x, y] = c.split(',').map(Number);
        return { x, y };
      });
      return svg._corners;
    }

    function nearestCorner(svg, p) {
      let best = null;
      let bestDist = SNAP_PX / pxPerUnit(svg);
      for (const c of cornersOf(svg)) {
        const d = Math.hypot(c.x - p.x, c.y - p.y);
        if (d <= bestDist) {
          best = c;
          bestDist = d;
        }
      }
      return best;
    }

    function overlay(svg) {
      let g = svg.querySelector('.measure');
      if (!g) {
        g = document.createElementNS(SVG_NS, 'g');
        g.setAttribute('class', 'measure');
        g.innerHTML = '<line class="m-line"/><circle class="m-start"/><circle class="m-snap"/><rect class="m-bg"/><text class="m-text"/><line class="m-guide"/>';
        svg.append(g);
      }
      return g;
    }

    const attrs = (el, values) => Object.entries(values).forEach(([k, v]) => el.setAttribute(k, v));
    const show = (el, visible) => el.setAttribute('visibility', visible ? 'visible' : 'hidden');

    // Draw the snap ring, and the measurement if one is in progress on this diagram.
    // ortho: constrain the line to horizontal or vertical (whichever the pointer is further along).
    function drawMeasure(svg, pointer, ortho = false) {
      const g = overlay(svg);
      const u = 1 / pxPerUnit(svg); // one screen pixel in diagram units
      const snap = pointer && nearestCorner(svg, pointer);
      const [line, startDot, snapRing, bg, text, guide] = g.children;
      show(guide, false);

      show(snapRing, !!snap);
      if (snap) attrs(snapRing, { cx: snap.x, cy: snap.y, r: 6 * u, fill: 'none', stroke: '#c53030', 'stroke-width': 2 * u });

      // Without a pointer (mouse left the diagram) an active measurement stays where it was.
      const active = measure && measure.svg === svg;
      show(startDot, active);
      if (!active) for (const el of [line, bg, text]) show(el, false);
      if (!active || !pointer) return;
      for (const el of [line, bg, text]) show(el, true);
      const { start } = measure;
      attrs(startDot, { cx: start.x, cy: start.y, r: 4 * u, fill: '#c53030' });

      let end = snap || pointer;
      if (ortho) {
        const horizontal = Math.abs(pointer.x - start.x) >= Math.abs(pointer.y - start.y);
        end = horizontal ? { x: end.x, y: start.y } : { x: start.x, y: end.y };
        // Faint guide from the snapped corner to the line's end, showing which corner sets the distance.
        if (snap && (snap.x !== end.x || snap.y !== end.y)) {
          show(guide, true);
          attrs(guide, { x1: snap.x, y1: snap.y, x2: end.x, y2: end.y, stroke: '#c53030', 'stroke-opacity': 0.6,
            'stroke-width': u, 'stroke-dasharray': `${2 * u} ${3 * u}` });
        }
      }
      attrs(line, { x1: start.x, y1: start.y, x2: end.x, y2: end.y, stroke: '#111', 'stroke-width': 1.5 * u,
        'stroke-dasharray': `${6 * u} ${4 * u}` });

      const dx = Math.abs(end.x - start.x);
      const dy = Math.abs(end.y - start.y);
      const label = `${fmt(Math.hypot(dx, dy))}  (Δx ${fmt(dx)}, Δy ${fmt(dy)})`;
      const size = 13 * u;
      const pad = 4 * u;
      attrs(text, { 'font-size': size, fill: '#111' });
      text.textContent = label;
      const w = text.getComputedTextLength() + 2 * pad; // measure the label as rendered
      const h = size + 2 * pad;
      // Beside the cursor, flipped to stay inside the sheet.
      let x = end.x + 12 * u;
      let y = end.y - 12 * u - h;
      if (x + w > Number(svg.dataset.length)) x = end.x - 12 * u - w;
      if (y < 0) y = end.y + 12 * u;
      attrs(bg, { x, y, width: w, height: h, rx: 3 * u, fill: '#fff', 'fill-opacity': 0.92, stroke: '#111', 'stroke-width': u });
      attrs(text, { x: x + pad, y: y + pad + size * 0.82 });
    }

    function clearMeasure() {
      if (!measure) return;
      const { svg } = measure;
      measure = null;
      drawMeasure(svg, null);
    }

    results.addEventListener('pointermove', (e) => {
      if (arranging?.moved) return;
      const svg = e.target.closest('svg[data-corners]');
      if (hoverSvg && hoverSvg !== svg) drawMeasure(hoverSvg, null);
      hoverSvg = svg;
      lastPointer = svg && { svg, point: toSvg(svg, e) };
      if (svg) drawMeasure(svg, lastPointer.point, e.shiftKey);
    });
    results.addEventListener('pointerleave', () => {
      if (hoverSvg && hoverSvg !== measure?.svg) drawMeasure(hoverSvg, null);
      hoverSvg = null;
      lastPointer = null;
    });
    results.addEventListener('click', (e) => {
      if (suppressClick) return;
      if (measure) return clearMeasure();
      const svg = e.target.closest('svg[data-corners]');
      const corner = svg && nearestCorner(svg, toSvg(svg, e));
      if (!corner) return;
      measure = { svg, start: corner };
      drawMeasure(svg, toSvg(svg, e), e.shiftKey);
    });
    document.addEventListener('keydown', (e) => e.key === 'Escape' && clearMeasure());
    for (const type of ['keydown', 'keyup']) {
      document.addEventListener(type, (e) => {
        if (e.key === 'Shift' && measure && lastPointer?.svg === measure.svg) drawMeasure(measure.svg, lastPointer.point, e.shiftKey);
      });
    }

    // Text measurement for diagram labels (SVG text uses the page font).
    const measureCtx = document.createElement('canvas').getContext('2d');
    function textWidth(text, size) {
      measureCtx.font = `100px ${getComputedStyle(document.body).fontFamily}`;
      return measureCtx.measureText(text).width * size / 100;
    }

    function fitText(text, maxWidth, size) {
      if (textWidth(text, size) <= maxWidth) return text;
      while (text && textWidth(text + '…', size) > maxWidth) text = text.slice(0, -1);
      return text ? text + '…' : '';
    }
  </script>
</body>
</html>
